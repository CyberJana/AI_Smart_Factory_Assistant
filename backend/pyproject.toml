[project]
name = "ai-smart-factory-api"
version = "0.1.0"
description = "API for the AI Smart Factory Assistant"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "pydantic-settings>=2.5,<3.0",
  "email-validator>=2.2,<3.0",
  "PyJWT>=2.9,<3.0",
  "pwdlib[argon2]>=0.2,<1.0",
  "python-multipart>=0.0.12,<1.0",
  "reportlab>=4.2,<5.0",
  "paho-mqtt>=2.1,<3.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
ai = ["openai>=1.50,<2.0", "langchain-core>=0.3,<1.0", "faiss-cpu>=1.9,<2.0"]
vision = ["opencv-python-headless>=4.10,<5.0", "ultralytics>=8.3,<9.0", "torch>=2.4,<3.0"]
dev = ["pytest>=8.3,<9.0", "httpx>=0.27,<1.0", "ruff>=0.7,<1.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"app/api/deps.py" = ["B008"]
"app/api/routes/*.py" = ["B008"]
